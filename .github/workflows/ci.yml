name: CI

on:
  push:
    branches: [main]
    # Le modifiche di sola documentazione non possono rompere test o build, e
    # aprivano comunque l'intero gate E2E: stack Supabase, `db reset` e 19 test
    # per una riga di Markdown. `main` non è un ramo protetto, quindi saltare i
    # check non lascia nessuna PR in attesa di uno stato che non arriverà.
    # NB: la lista è ripetuta di proposito sotto `pull_request`. Gli anchor YAML
    # sarebbero il modo naturale di non duplicarla, ma GitHub Actions non li
    # supporta: il file resterebbe YAML valido e verrebbe rifiutato dal parser,
    # e il sintomo — nessun check che parte — è indistinguibile da un
    # `paths-ignore` che funziona. Meglio quattro righe in più.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: test-anon-key
      VITE_APP_URL: http://localhost:5173
      VITE_APP_NAME: entro
      VITE_ENABLE_BARCODE_SCANNER: "true"
      VITE_ENABLE_SWIPE_GESTURES: "true"
      VITE_ENABLE_SHARED_LISTS: "true"
      VITE_ENABLE_NOTIFICATIONS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build

  # I guardiani di famiglia (#149): i test `*.family.test.*` confrontano entro
  # con `entro-family` ed `entro-mobile`, che sono **privati**. Stanno in un job
  # a parte perché `npm test` deve passare in un clone nuovo, e perché i secret
  # con i token non arrivano alle PR aperte da un fork: lì questo job non parte,
  # e il resto della CI resta verde. Sul repo principale, e su ogni push a
  # `main`, parte sempre. Senza la sorgente affiancata i test falliscono, non si
  # saltano: un controllo che passa mentre non guarda niente non è un controllo.
  family:
    name: Guardiani di famiglia
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: test-anon-key
      ENTRO_FAMILY_DIR: ${{ github.workspace }}/.entro-family
      ENTRO_MOBILE_SCHEMAS_DIR: ${{ github.workspace }}/.entro-mobile/src/shared/validations
      ENTRO_MOBILE_SHARED_LIB_DIR: ${{ github.workspace }}/.entro-mobile/src/shared/lib
      ENTRO_MOBILE_LIB_DIR: ${{ github.workspace }}/.entro-mobile/src/lib

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # `src/lib/__tests__/expiryLabels.family.test.ts` confronta le etichette dello
      # stato di scadenza con la tabella di `core/expiry-status.md` nel bundle
      # di famiglia: il testo che l'utente legge è dominio, e prima viveva
      # copiato a mano qui e sul client nativo (entro-mobile#44).
      #
      # `entro-family` è **privato**, quindi serve `ENTRO_FAMILY_TOKEN`, un PAT
      # fine-grained con il solo permesso *Contents: read* su quel repo.
      #
      # `conventions/` accanto a `core/` dal 9 set 2026: `englishNames.family.test.ts`
      # legge da lì `italian-words.txt`. Con lo sparse-checkout del solo `core`
      # quel file non arriva e il guardiano fallisce **in CI e non in locale**,
      # che è il modo peggiore di scoprirlo.
      - name: Checkout entro-family (dominio e convenzioni)
        uses: actions/checkout@v5
        with:
          repository: E-Lop/entro-family
          token: ${{ secrets.ENTRO_FAMILY_TOKEN }}
          path: .entro-family
          sparse-checkout: |
            core
            conventions

      # `src/lib/__tests__/foodSchemaParity.family.test.ts` fa girare questo schema di
      # validazione e la sua copia sul client nativo sulla stessa batteria di
      # payload: i due `food.schemas.ts` non sono un pacchetto condiviso, sono
      # due file in due repo, e senza questo confronto divergono in silenzio
      # ([#120](https://github.com/E-Lop/entro/issues/120)).
      #
      # `entro-mobile` è **privato**, quindi serve `ENTRO_MOBILE_TOKEN`, un PAT
      # fine-grained con il solo permesso *Contents: read* su quel repo.
      # ⚠️ **Scade il 10 dicembre 2026** (90 giorni dall'11 set). Quando
      # succederà, questo passo fallirà con `Repository not found` — che è il
      # messaggio sbagliato per la causa vera, e il motivo per cui la data sta
      # scritta qui invece che solo nelle impostazioni dell'account.

      - name: Checkout entro-mobile (lo schema e la tabella gemelli)
        uses: actions/checkout@v5
        with:
          repository: E-Lop/entro-mobile
          token: ${{ secrets.ENTRO_MOBILE_TOKEN }}
          path: .entro-mobile
          # Cinque guardiani leggono di qui: lo schema di validazione (#120), la
          # tabella dei messaggi di autenticazione (#100), che
          # `authErrorMessageParity.family.test.ts` confronta col nostro, quella
          # degli inviti (#101), per `inviteErrorMessageParity.family.test.ts`,
          # il `fetch` che trattiene le richieste senza token (#229), per
          # `sessionBoundFetchParity.family.test.ts`, e quello che segnala le
          # richieste fallite a Sentry (#192), per
          # `supabaseFailureReportParity.family.test.ts`. File singoli e non le
          # cartelle `src/shared/lib` e `src/lib`: serve quello, non un progetto.
          sparse-checkout: |
            src/shared/validations
            src/shared/lib/authErrorMessage.ts
            src/shared/lib/inviteErrorMessage.ts
            src/shared/lib/supabaseFailureReport.ts
            src/lib/sessionBoundFetch.ts
          # ⚠️ Non-cone **di proposito**, ed è il passo che ha reso rossa la
          # prima corsa di questa PR. In modalità cone lo sparse-checkout porta
          # sempre anche i file di radice, `tsconfig.json` compreso — che su
          # entro-mobile dichiara `"extends": "expo/tsconfig.base"` e si risolve
          # dentro il **suo** `node_modules`. Qui quel `node_modules` non esiste
          # e non deve esistere: serve un file, non un progetto. Il risultato era
          # `[TSCONFIG_ERROR] Failed to load tsconfig … Tsconfig not found`, un
          # rosso che in locale non si vede perché lì le dipendenze native ci
          # sono. Senza quel file la trasformazione risale e trova il tsconfig di
          # questo repo, che è quello giusto per un file compilato da noi.
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guardiani di famiglia
        run: npm run test:family


  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    # Il budget è il caso peggiore di una corsa sana, non un multiplo (#250).
    # Corsa 43458254539, cache presente: 451 s in tutto. Il passo apt che ha
    # girato (9 s) si conta col suo limite di 300 s: 742 s. Più 180 s per i
    # ripieghi della catena dei registri di Supabase (2 ritentativi a 4 s e
    # 8 s per registro, ECR a 1 pull/s senza autenticazione): 922 s, cioè 16
    # minuti per eccesso. Con 25 il margine si pagava per intero in attese inutili.
    timeout-minutes: 16
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: ${{ vars.LOCAL_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0' }}
      E2E_SUPABASE_URL: http://127.0.0.1:54321
      E2E_SUPABASE_ANON_KEY: ${{ vars.LOCAL_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0' }}
      E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ vars.LOCAL_SUPABASE_SERVICE_ROLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU' }}
      VITE_APP_URL: http://127.0.0.1:5173
      VITE_APP_NAME: entro
      VITE_ENABLE_BARCODE_SCANNER: "true"
      VITE_ENABLE_SWIPE_GESTURES: "true"
      VITE_ENABLE_SHARED_LISTS: "true"
      VITE_ENABLE_NOTIFICATIONS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # I browser pesano ~177 MiB e non cambiano se non cambia Playwright:
      # la chiave è la sua versione, letta dal pacchetto installato.
      - name: Versione di Playwright
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache dei browser Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2.1.1
        with:
          version: 2.108.0

      # `setup-cli` v2.1.1 esporta SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io in
      # GITHUB_ENV, e con quella variabile la CLI 2.108.0 scarica ogni immagine
      # dal solo ghcr.io: il 22 e il 27 ott ha risposto `toomanyrequests` e il
      # job si è fermato (#250). Senza, la CLI prova public.ecr.aws, poi ghcr.io,
      # poi Docker Hub. Si toglie nello script di ogni passo che lancia la CLI,
      # perché un `env:` di passo contro un valore di GITHUB_ENV non è verificato.
      - name: Start Supabase local stack
        run: |
          unset SUPABASE_INTERNAL_IMAGE_REGISTRY
          supabase start

      # Da quale registro sono arrivate le immagini: è la prova della catena (#250).
      - name: Immagini scaricate
        run: docker images --format '{{.Repository}}:{{.Tag}}' | sort

      - name: Reset local database
        run: |
          unset SUPABASE_INTERNAL_IMAGE_REGISTRY
          supabase db reset

      # I permessi delle funzioni si vedono solo sul database: a leggere le
      # migrazioni l'EXECUTE a PUBLIC non compare, perché è un default (#160).
      # `supabase test db` scarica pg_prove: il 22 ott è caduto proprio lì, con
      # ghcr.io a `toomanyrequests` (#250).
      - name: Database tests (pgTAP)
        run: |
          unset SUPABASE_INTERNAL_IMAGE_REGISTRY
          supabase test db

      # La gara fra due create_personal_list concorrenti (#195): pgTAP gira
      # in una transazione sola e non la può provare, qui le sessioni sono due.
      - name: Database concurrency (create_personal_list)
        run: bash supabase/tests/concurrency/create_personal_list_race.sh

      # Due membri di una lista di due che escono insieme (#184).
      - name: Database concurrency (leave_list)
        run: bash supabase/tests/concurrency/leave_list_race.sh

      # Il creatore toglie un membro mentre quel membro esce da sé (#196).
      - name: Database concurrency (remove_list_member)
        run: bash supabase/tests/concurrency/remove_list_member_race.sh

      # L'accettazione con conferma di un invito in gara con un'altra uscita
      # dalla stessa lista, e due join incrociati (#239).
      - name: Database concurrency (join_list_via_invite)
        run: bash supabase/tests/concurrency/join_list_via_invite_race.sh

      # La suite di smoke API (#187) sullo stesso stack: crea le sentinelle A e
      # B, ripristino, livelli a, b e c, di nuovo ripristino. Prima dell'E2E
      # perché dura pochi secondi, e un rosso qui arriva quattro minuti prima.
      - name: Suite di smoke API
        run: npm run smoke:local

      # I due passi che passano da apt vengono dopo le prove del database (#250):
      # un mirror lento o il DNS di Canonical giù (22 e 26 ott, 11 nov) li fa
      # scadere, e prima si portavano dietro pgTAP, gli script di gara e lo
      # smoke, che restavano «skipped». Ora può fallire solo l'E2E.
      # A cache mancante scarica il browser e le librerie di sistema. In
      # condizioni normali dura ~1m12s: a cinque minuti è patologico, e fallire
      # subito è un'informazione mentre aspettare venti minuti non lo è.
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium

      # Con la cache i binari ci sono già, ma le librerie di sistema no: stanno
      # fuori da `~/.cache/ms-playwright` e vanno installate lo stesso.
      - name: Dipendenze di sistema (cache presente)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 5
        run: npx playwright install-deps chromium

      - name: Run Playwright E2E
        run: npm run test:e2e
