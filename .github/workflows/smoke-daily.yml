# Il giro giornaliero contro la produzione (#190, #191): ripristino dei dati
# noti, poi la suite nel browser su entroapp.it.
#
# Il ripristino riscrive le date degli alimenti noti relative a oggi e tocca
# solo i dati delle sentinelle. Subito dopo la suite nel browser entra come A
# e controlla che la dashboard mostri le cinque card con le loro etichette:
# «Scade oggi» vale solo nel giorno del ripristino, ed è il controllo che
# distingue una schermata viva da una vecchia. Avvisa Healthchecks a inizio e
# fine giro, quindi arriva un avviso anche quando il giro non parte.
#
# Niente scatti, video né tracce (lo vieta `playwright.smoke.config.ts`), e
# nessun artefatto caricato: il repo è pubblico.
#
# Cosa fare quando arriva un avviso: `CONTRIBUTING.md`, «Smoke in produzione».

name: Smoke in produzione, giro giornaliero

on:
  schedule:
    # 05:43 UTC, cioè 06:43 o 07:43 a Roma: lontano dalla mezzanotte di Roma,
    # così ripristino e controllo cadono nello stesso giorno delle etichette.
    - cron: '43 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Ripristino, poi la dashboard di A
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # I secret stanno solo qui, e l'Environment è legato a `main` (#189).
    environment: production
    # In fila con gli altri giri contro la produzione: vedi `smoke-hourly.yml`.
    concurrency:
      group: smoke-production
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Ogni passo riceve solo i secret che usa: `npm ci` e gli script
      # d'installazione delle dipendenze non ne vedono nessuno.
      - name: Secret presenti?
        id: secrets
        env:
          SMOKE_SUPABASE_URL: ${{ secrets.SMOKE_SUPABASE_URL }}
          SMOKE_SUPABASE_ANON_KEY: ${{ secrets.SMOKE_SUPABASE_ANON_KEY }}
          SMOKE_A_EMAIL: ${{ secrets.SMOKE_A_EMAIL }}
          SMOKE_A_PASSWORD: ${{ secrets.SMOKE_A_PASSWORD }}
          SMOKE_B_EMAIL: ${{ secrets.SMOKE_B_EMAIL }}
          SMOKE_B_PASSWORD: ${{ secrets.SMOKE_B_PASSWORD }}
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_DAILY_URL }}
        run: bash scripts/smoke/require-secrets.sh SMOKE_SUPABASE_URL SMOKE_SUPABASE_ANON_KEY SMOKE_A_EMAIL SMOKE_A_PASSWORD SMOKE_B_EMAIL SMOKE_B_PASSWORD HEALTHCHECKS_URL

      - name: Setup Node
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.secrets.outputs.ready == 'true'
        run: npm ci

      # Come nel job E2E della CI: la chiave della cache è la versione di
      # Playwright, letta dal pacchetto installato.
      - name: Versione di Playwright
        if: steps.secrets.outputs.ready == 'true'
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache dei browser Playwright
        if: steps.secrets.outputs.ready == 'true'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browser
        if: steps.secrets.outputs.ready == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium

      - name: Dipendenze di sistema (cache presente)
        if: steps.secrets.outputs.ready == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 5
        run: npx playwright install-deps chromium

      # Un comando solo dentro i segnali: se il ripristino fallisce la suite
      # nel browser non parte, perché le etichette attese non varrebbero.
      - name: Ripristino e dashboard di A, con i segnali a Healthchecks
        if: steps.secrets.outputs.ready == 'true'
        env:
          SMOKE_SUPABASE_URL: ${{ secrets.SMOKE_SUPABASE_URL }}
          SMOKE_SUPABASE_ANON_KEY: ${{ secrets.SMOKE_SUPABASE_ANON_KEY }}
          SMOKE_A_EMAIL: ${{ secrets.SMOKE_A_EMAIL }}
          SMOKE_A_PASSWORD: ${{ secrets.SMOKE_A_PASSWORD }}
          SMOKE_B_EMAIL: ${{ secrets.SMOKE_B_EMAIL }}
          SMOKE_B_PASSWORD: ${{ secrets.SMOKE_B_PASSWORD }}
          SMOKE_SITE_URL: https://entroapp.it
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_DAILY_URL }}
        run: node scripts/smoke/healthchecks.mjs 'npm run smoke:restore && npm run smoke:browser'
