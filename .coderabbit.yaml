# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Prova di CodeRabbit (#232): dieci PR, poi si tiene o si toglie con i numeri.
# Le chiavi assenti restano ai default dello schema.

language: it-IT

reviews:
  # Il corpo della PR lo scriviamo noi: porta `Closes #N` e le prove, e
  # CodeRabbit con il default lo riscriverebbe. Il riassunto resta, nel suo
  # commento.
  high_level_summary: false
  high_level_summary_in_walkthrough: true

  # Un solo maintainer, e le etichette di triage sono per le issue, non per
  # le PR (docs/agents/issue-tracker.md).
  suggested_reviewers: false
  suggested_labels: false

  path_filters:
    - "!package-lock.json"

  pre_merge_checks:
    custom_checks:
      # La regola che sfugge più spesso (CONTRIBUTING.md, «Release»): le link
      # reference si erano fermate a [1.9.0] per quattro release.
      # Le PR di sola documentazione non si rilasciano (CONTRIBUTING.md,
      # «Release»), e la #242 ha avuto l'avviso lo stesso. I percorsi sono
      # quelli che `ci.yml` salta in `paths-ignore`: se cambia quella lista,
      # vanno cambiate questa e quella di CONTRIBUTING.md.
      - name: "Versione e CHANGELOG"
        mode: warning
        instructions: |
          Se ogni file cambiato dalla PR è documentazione, il controllo passa senza guardare i tre punti qui sotto: le PR di sola documentazione non portano una release. È documentazione un file che finisce in `.md`, che sta sotto `docs/`, che è `LICENSE` o che sta sotto `.github/ISSUE_TEMPLATE/`. Basta un file fuori da questi percorsi perché valgano i tre punti.

          Altrimenti passa se la PR fa tutte e tre le cose seguenti, fallisce se ne manca anche una.

          1. In `package.json` il campo `version` è diverso da quello del ramo base, ed è un incremento semver.
          2. In cima a `CHANGELOG.md`, sotto l'introduzione, c'è una sezione nuova `## [X.Y.Z] - AAAA-MM-GG`, dove X.Y.Z è la nuova `version` di `package.json`.
          3. In fondo a `CHANGELOG.md` c'è la riga `[X.Y.Z]: https://github.com/E-Lop/entro/compare/vP...vX.Y.Z`, dove P è la `version` del ramo base, e la riga `[Unreleased]` confronta a partire da `vX.Y.Z`.

          Se fallisce, indica quale dei tre punti manca.

knowledge_base:
  code_guidelines:
    filePatterns:
      - CLAUDE.md
      - CONTRIBUTING.md
